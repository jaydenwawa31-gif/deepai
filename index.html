<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excuse Generator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #202033;
      background: linear-gradient(135deg, #d8f3ff, #f5ddff);
    }

    main {
      width: min(100%, 520px);
      padding: 36px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 16px 50px #433b6b22;
    }

    h1 { margin-top: 0; }

    #excuse {
      min-height: 72px;
      margin: 28px 0;
      font-size: 1.35rem;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      color: white;
      background: #6956d8;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #5140bd; }
    button:focus-visible { outline: 3px solid #202033; outline-offset: 4px; }

    .note { color: #686879; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>🕒 The Excuse Generator</h1>
    <p>Need a totally ridiculous reason you’re late?</p>

    <p id="excuse" aria-live="polite">Click the button and let fate decide.</p>

    <button id="generate">Generate an excuse</button>
    <p class="note">For laughs only. Maybe still send a real apology!</p>
  </main>

  <script>
    const excuses = [
      "A squirrel challenged me to a staring contest. I lost.",
      "My shoes were having a disagreement about which way to go.",
      "I got trapped in a very polite conversation with a revolving door.",
      "My cat sat on my keys and declared them a throne.",
      "A cloud looked suspicious, so I took the long way around.",
      "I was waiting for my toast to emotionally recover.",
      "My GPS said, “You’re on your own,” and honestly, fair.",
      "I had to help a tiny bug cross the sidewalk. It was a long journey."
    ];

    const excuse = document.querySelector("#excuse");
    const button = document.querySelector("#generate");

    button.addEventListener("click", () => {
      const randomIndex = Math.floor(Math.random() * excuses.length);
      excuse.textContent = excuses[randomIndex];
    });
  </script>
</body>
</html>
